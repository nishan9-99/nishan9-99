<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" font-family="'Courier New',monospace">
  <rect width="900" height="330" fill="#05070A"/>
  <rect x="8" y="8" width="884" height="314" fill="none" stroke="#12303C"/>
  <text x="40" y="42" font-size="13" fill="#7DD3FC" letter-spacing="4">3D WORLD-BUILDING MODULE</text>
  <rect x="700" y="28" width="160" height="24" fill="#0D1117" stroke="#FF9E64" stroke-opacity="0.7"/>
  <text x="780" y="44" font-size="11" fill="#FF9E64" text-anchor="middle" letter-spacing="2">STATUS: LEARNING</text>
  <line x1="40" y1="56" x2="860" y2="56" stroke="#12303C" stroke-dasharray="5 7"/>
  <g transform="translate(190,185)" stroke="#7DD3FC" fill="none">
    <g stroke-opacity="0.9">
      <animateTransform attributeName="transform" type="scale" values="1 1;0.55 1;1 1;-0.55 1;1 1" dur="6s" repeatCount="indefinite" additive="sum"/>
      <rect x="-45" y="-45" width="90" height="90" stroke-opacity="0.8"/>
      <rect x="-25" y="-25" width="90" height="90" stroke-opacity="0.5"/>
      <line x1="-45" y1="-45" x2="-25" y2="-25"/>
      <line x1="45" y1="-45" x2="65" y2="-25"/>
      <line x1="45" y1="45" x2="65" y2="65"/>
      <line x1="-45" y1="45" x2="-25" y2="65"/>
    </g>
    <circle r="78" fill="none" stroke="#12303C" stroke-dasharray="3 8">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="22s" repeatCount="indefinite"/>
    </circle>
    <text y="112" font-size="10" fill="#5B6B7F" text-anchor="middle" letter-spacing="2" stroke="none">RENDERING WORLD...</text>
  </g>
  <g font-size="12" letter-spacing="1">
    <text x="400" y="100" fill="#31404F" font-size="10" letter-spacing="3">PROGRESS &#183; SELF-ASSESSED &#183; EDITABLE</text>
    <text x="400" y="130" fill="#C9D1D9">MODELLING</text>
    <rect x="560" y="120" width="240" height="12" fill="#0D1117" stroke="#12303C"/>
    <rect x="562" y="122" width="72" height="8" fill="#7DD3FC"><animate attributeName="opacity" values="0.8;1;0.8" dur="2.4s" repeatCount="indefinite"/></rect>
    <text x="812" y="130" fill="#5B6B7F" font-size="10">30%</text>
    <text x="400" y="162" fill="#C9D1D9">ENVIRONMENTS</text>
    <rect x="560" y="152" width="240" height="12" fill="#0D1117" stroke="#12303C"/>
    <rect x="562" y="154" width="48" height="8" fill="#7DD3FC"><animate attributeName="opacity" values="0.8;1;0.8" dur="2.8s" repeatCount="indefinite"/></rect>
    <text x="812" y="162" fill="#5B6B7F" font-size="10">20%</text>
    <text x="400" y="194" fill="#C9D1D9">MATERIALS</text>
    <rect x="560" y="184" width="240" height="12" fill="#0D1117" stroke="#12303C"/>
    <rect x="562" y="186" width="60" height="8" fill="#7DD3FC"><animate attributeName="opacity" values="0.8;1;0.8" dur="2.2s" repeatCount="indefinite"/></rect>
    <text x="812" y="194" fill="#5B6B7F" font-size="10">25%</text>
    <text x="400" y="226" fill="#C9D1D9">LIGHTING</text>
    <rect x="560" y="216" width="240" height="12" fill="#0D1117" stroke="#12303C"/>
    <rect x="562" y="218" width="36" height="8" fill="#7DD3FC"><animate attributeName="opacity" values="0.8;1;0.8" dur="3s" repeatCount="indefinite"/></rect>
    <text x="812" y="226" fill="#5B6B7F" font-size="10">15%</text>
    <text x="400" y="258" fill="#C9D1D9">SCENE BUILDING</text>
    <rect x="560" y="248" width="240" height="12" fill="#0D1117" stroke="#12303C"/>
    <rect x="562" y="250" width="48" height="8" fill="#7DD3FC"><animate attributeName="opacity" values="0.8;1;0.8" dur="2.6s" repeatCount="indefinite"/></rect>
    <text x="812" y="258" fill="#5B6B7F" font-size="10">20%</text>
  </g>
  <text x="400" y="296" font-size="10" fill="#5B6B7F" letter-spacing="1">&gt; EXPLORING &#183; EXPERIMENTING &#183; BUILDING FIRST WORLDS</text>
  <text x="40" y="312" font-size="9" fill="#31404F" letter-spacing="2">MODULE IN EARLY TRAINING &#183; NOT AN EXPERT CLAIM</text>
</svg>

