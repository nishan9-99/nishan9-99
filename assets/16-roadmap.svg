  <text x="450" y="268" font-size="11" fill="#C9D1D9" text-anchor="middle" letter-spacing="2">BUILDING WORLDS, ONE SYSTEM AT A TIME.</text>
  <text x="450" y="296" font-size="9" fill="#31404F" text-anchor="middle" letter-spacing="2">GOALS AND DIRECTIONS &#183; NOT CLAIMS OF COMPLETED WORK</text>
