<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320" font-family="'Courier New',monospace">
  <defs>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="900" height="320" fill="#05070A"/>
  <rect x="8" y="8" width="884" height="304" fill="none" stroke="#12303C"/>
  <text x="40" y="42" font-size="13" fill="#00E5FF" letter-spacing="4">SIGNAL SCAN // VISITOR RADAR</text>
  <line x1="40" y1="56" x2="860" y2="56" stroke="#12303C" stroke-dasharray="5 7"/>
  <g transform="translate(220,185)">
    <circle r="105" fill="none" stroke="#12303C"/>
    <circle r="78" fill="none" stroke="#12303C"/>
    <circle r="51" fill="none" stroke="#12303C"/>
    <circle r="24" fill="none" stroke="#12303C"/>
    <line x1="-105" y1="0" x2="105" y2="0" stroke="#12303C"/>
    <line x1="0" y1="-105" x2="0" y2="105" stroke="#12303C"/>
    <path d="M0 0 L105 0 A105 105 0 0 0 74 -74 Z" fill="url(#sweep)">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4s" repeatCount="indefinite"/>
    </path>
    <line x1="0" y1="0" x2="105" y2="0" stroke="#00E5FF" stroke-opacity="0.9">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4s" repeatCount="indefinite"/>
    </line>
    <circle r="4" fill="#00E5FF"/>
    <circle cx="52" cy="-38" r="4" fill="#B388FF">
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.6;1" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="-66" cy="30" r="3.5" fill="#7DD3FC">
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.35;0.8;1" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="20" cy="70" r="3" fill="#00E5FF">
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.6;0.95;1" dur="4s" repeatCount="indefinite"/>
    </circle>
  </g>
  <g font-size="12" letter-spacing="2">
    <text x="430" y="110" fill="#31404F" font-size="10" letter-spacing="3">SCAN REPORT</text>
    <text x="430" y="140" fill="#5B6B7F">TARGETS <tspan fill="#31404F">.......... </tspan><tspan fill="#F2F5F9">VISITORS</tspan></text>
    <text x="430" y="166" fill="#5B6B7F">STATUS <tspan fill="#31404F">........... </tspan><tspan fill="#00E5FF">TRACKING</tspan></text>
    <text x="430" y="192" fill="#5B6B7F">SIGNAL <tspan fill="#31404F">........... </tspan><tspan fill="#00E5FF">STRONG</tspan></text>
    <text x="430" y="218" fill="#5B6B7F">THREAT LEVEL <tspan fill="#31404F">..... </tspan><tspan fill="#B388FF">ZERO &#183; FRIENDLY</tspan></text>
    <text x="430" y="252" fill="#31404F" font-size="10">&gt; TARGET ACQUIRED: YOU. WELCOME IN.</text>
  </g>
  <circle cx="416" cy="248" r="3" fill="#00E5FF"><animate attributeName="opacity" values="1;0.2;1" dur="1.1s" repeatCount="indefinite"/></circle>
  <text x="430" y="288" font-size="9" fill="#31404F" letter-spacing="2">RADAR SWEEPS EVERY 4 SECONDS &#183; NOTHING ESCAPES</text>
</svg>

