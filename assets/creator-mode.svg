<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" font-family="'Courier New',monospace">
  <rect width="900" height="380" fill="#05070A"/>
  <rect x="8" y="8" width="884" height="364" fill="none" stroke="#12303C"/>
  <rect x="296" y="26" width="308" height="34" fill="none" stroke="#00E5FF"/>
  <rect x="300" y="30" width="300" height="26" fill="none" stroke="#12303C"/>
  <text x="450" y="48" font-size="13" fill="#00E5FF" text-anchor="middle" letter-spacing="4">CREATOR MODE // ACTIVE</text>
  <g font-size="15" fill="#C9D1D9">
    <text x="60" y="104">I don&#8217;t want to only write code.</text>
    <text x="60" y="130">I want to <tspan fill="#F2F5F9" font-weight="bold">build things</tspan>.</text>
  </g>
  <g font-size="12" letter-spacing="2">
    <rect x="60" y="156" width="90" height="26" fill="#0D1117" stroke="#00E5FF" stroke-opacity="0.6"/><text x="105" y="174" fill="#00E5FF" text-anchor="middle">CODE</text>
    <rect x="165" y="156" width="96" height="26" fill="#0D1117" stroke="#B388FF" stroke-opacity="0.6"/><text x="213" y="174" fill="#B388FF" text-anchor="middle">GAMES</text>
    <rect x="276" y="156" width="100" height="26" fill="#0D1117" stroke="#7DD3FC" stroke-opacity="0.6"/><text x="326" y="174" fill="#7DD3FC" text-anchor="middle">WORLDS</text>
    <rect x="391" y="156" width="100" height="26" fill="#0D1117" stroke="#B388FF" stroke-opacity="0.6"/><text x="441" y="174" fill="#B388FF" text-anchor="middle">VISUALS</text>
    <rect x="506" y="156" width="140" height="26" fill="#0D1117" stroke="#00E5FF" stroke-opacity="0.6"/><text x="576" y="174" fill="#00E5FF" text-anchor="middle">EXPERIENCES</text>
  </g>
  <g transform="translate(700,90)">
    <g stroke="#12303C" stroke-width="2" fill="none">
      <line x1="0" y1="20" x2="0" y2="230"/>
    </g>
    <line x1="0" y1="20" x2="0" y2="230" stroke="#00E5FF" stroke-opacity="0.5" stroke-dasharray="3 9" fill="none">
      <animate attributeName="stroke-dashoffset" values="0;-48" dur="1.2s" repeatCount="indefinite"/>
    </line>
    <g font-size="12" letter-spacing="2">
      <circle cx="0" cy="20" r="5" fill="#00E5FF"/><text x="16" y="24" fill="#F2F5F9">CODE</text>
      <circle cx="0" cy="62" r="5" fill="#00E5FF"/><text x="16" y="66" fill="#F2F5F9">CREATE</text>
      <circle cx="0" cy="104" r="5" fill="#B388FF"/><text x="16" y="108" fill="#F2F5F9">MODEL</text>
      <circle cx="0" cy="146" r="5" fill="#B388FF"/><text x="16" y="150" fill="#F2F5F9">EDIT</text>
      <circle cx="0" cy="188" r="5" fill="#7DD3FC"/><text x="16" y="192" fill="#F2F5F9">BUILD</text>
      <circle cx="0" cy="230" r="5" fill="#FF9E64">
        <animate attributeName="r" values="5;8;5" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="16" y="234" fill="#FF9E64">PLAY</text>
    </g>
  </g>
  <text x="60" y="220" font-size="11" fill="#31404F" letter-spacing="2">CODE IS THE ENGINE.</text>
  <text x="60" y="240" font-size="11" fill="#31404F" letter-spacing="2">CREATIVITY IS THE FUEL.</text>
  <text x="60" y="340" font-size="10" fill="#5B6B7F" letter-spacing="2">&gt; SYSTEM: VISITOR STILL SCROLLING. RESPECT.</text>
  <circle cx="46" cy="336" r="3" fill="#00E5FF"><animate attributeName="opacity" values="1;0.2;1" dur="1.3s" repeatCount="indefinite"/></circle>
</svg>

