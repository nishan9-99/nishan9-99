<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340" font-family="'Courier New',monospace">
  <defs>
    <linearGradient id="aurabar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="60%" stop-color="#7DD3FC"/>
      <stop offset="100%" stop-color="#B388FF"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="900" height="340" fill="#05070A"/>
  <rect x="8" y="8" width="884" height="324" fill="none" stroke="#12303C"/>
  <g transform="translate(740,170)" fill="none" stroke="#B388FF">
    <circle r="40" stroke-opacity="0.3">
      <animate attributeName="r" values="30;90" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.4;0" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle r="40" stroke-opacity="0.3">
      <animate attributeName="r" values="30;90" dur="3s" begin="1.5s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.4;0" dur="3s" begin="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle r="26" fill="#0D1117" stroke="#B388FF" stroke-opacity="0.8"/>
    <text y="4" font-size="10" fill="#B388FF" text-anchor="middle" letter-spacing="1">AURA</text>
  </g>
  <text x="40" y="42" font-size="13" fill="#B388FF" letter-spacing="4">AURA // SYSTEM</text>
  <text x="860" y="42" font-size="10" fill="#FF9E64" text-anchor="end" letter-spacing="2">! EXPERIMENTAL MODULE</text>
  <line x1="40" y1="56" x2="860" y2="56" stroke="#12303C" stroke-dasharray="5 7"/>
  <text x="40" y="100" font-size="10" fill="#31404F" letter-spacing="3">AURA LEVEL</text>
  <rect x="40" y="112" width="560" height="22" fill="#0D1117" stroke="#12303C"/>
  <rect x="42" y="114" width="556" height="18" fill="url(#aurabar)">
    <animate attributeName="opacity" values="0.85;1;0.85" dur="2.6s" repeatCount="indefinite"/>
  </rect>
  <rect x="42" y="114" width="90" height="18" fill="url(#shine)">
    <animate attributeName="x" values="-48;600" dur="3.2s" repeatCount="indefinite"/>
  </rect>
  <text x="614" y="128" font-size="12" fill="#B388FF">MAXIMUM</text>
  <g font-size="12" letter-spacing="2">
    <text x="40" y="170" fill="#5B6B7F">SYSTEM <tspan fill="#31404F">............ </tspan><tspan fill="#00E5FF">OVERDRIVE</tspan></text>
    <text x="40" y="196" fill="#5B6B7F">PRESENCE <tspan fill="#31404F">.......... </tspan><tspan fill="#00E5FF">DETECTED</tspan></text>
    <text x="40" y="222" fill="#5B6B7F">CREATOR ENERGY <tspan fill="#31404F">.... </tspan><tspan fill="#FF9E64">UNSTABLE</tspan></text>
    <text x="40" y="248" fill="#5B6B7F">STYLE <tspan fill="#31404F">............. </tspan><tspan fill="#B388FF">MAXIMUM</tspan></text>
  </g>
  <g font-size="11" fill="#FF9E64">
    <text x="40" y="288">&gt; WARNING: PLAYER AURA EXCEEDS RECOMMENDED LIMITS.<animate attributeName="opacity" values="1;0.35;1" dur="1.6s" repeatCount="indefinite"/></text>
    <text x="40" y="308" fill="#5B6B7F">&gt; SYSTEM: VISUAL PRESENCE DETECTED. BRO BROKE THE README.</text>
  </g>
</svg>

