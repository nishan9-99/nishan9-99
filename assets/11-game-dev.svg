<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" font-family="'Courier New',monospace">
  <rect width="900" height="330" fill="#05070A"/>
  <rect x="8" y="8" width="884" height="314" fill="none" stroke="#12303C"/>
  <text x="40" y="42" font-size="13" fill="#FF9E64" letter-spacing="4">GAME DEVELOPMENT MODULE</text>
  <rect x="700" y="28" width="160" height="24" fill="#0D1117" stroke="#FF9E64" stroke-opacity="0.7"/>
  <text x="780" y="44" font-size="11" fill="#FF9E64" text-anchor="middle" letter-spacing="2">STATUS: LEARNING</text>
  <line x1="40" y1="56" x2="860" y2="56" stroke="#12303C" stroke-dasharray="5 7"/>
  <line x1="100" y1="170" x2="800" y2="170" stroke="#12303C" stroke-width="2"/>
  <line x1="100" y1="170" x2="800" y2="170" stroke="#FF9E64" stroke-opacity="0.4" stroke-dasharray="3 9">
    <animate attributeName="stroke-dashoffset" values="0;-48" dur="1.4s" repeatCount="indefinite"/>
  </line>
  <circle r="5" fill="#00E5FF">
    <animate attributeName="cx" values="100;800" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="170;170" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.92;1" dur="5s" repeatCount="indefinite"/>
  </circle>
  <g font-size="12" text-anchor="middle">
    <circle cx="100" cy="170" r="9" fill="#0D1117" stroke="#7DD3FC" stroke-width="2"/>
    <text x="100" y="145" fill="#7DD3FC" letter-spacing="1">IDEA</text>
    <text x="100" y="200" font-size="9" fill="#7DD3FC" letter-spacing="1">EXPLORING</text>
    <circle cx="240" cy="170" r="9" fill="#0D1117" stroke="#FF9E64" stroke-width="2">
      <animate attributeName="stroke-opacity" values="1;0.4;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="240" y="145" fill="#FF9E64" letter-spacing="1">PROTOTYPE</text>
    <text x="240" y="200" font-size="9" fill="#FF9E64" letter-spacing="1">LEARNING</text>
    <circle cx="380" cy="170" r="9" fill="#0D1117" stroke="#3A4454" stroke-width="2"/>
    <text x="380" y="145" fill="#5B6B7F" letter-spacing="1">MECHANICS</text>
    <text x="380" y="200" font-size="9" fill="#3A4454" letter-spacing="1">LOCKED</text>
    <circle cx="520" cy="170" r="9" fill="#0D1117" stroke="#3A4454" stroke-width="2"/>
    <text x="520" y="145" fill="#5B6B7F" letter-spacing="1">WORLD</text>
    <text x="520" y="200" font-size="9" fill="#3A4454" letter-spacing="1">LOCKED</text>
    <circle cx="660" cy="170" r="9" fill="#0D1117" stroke="#3A4454" stroke-width="2"/>
    <text x="660" y="145" fill="#5B6B7F" letter-spacing="1">POLISH</text>
    <text x="660" y="200" font-size="9" fill="#3A4454" letter-spacing="1">LOCKED</text>
    <circle cx="800" cy="170" r="9" fill="#0D1117" stroke="#3A4454" stroke-width="2"/>
    <text x="800" y="145" fill="#5B6B7F" letter-spacing="1">PLAYABLE</text>
    <text x="800" y="200" font-size="9" fill="#3A4454" letter-spacing="1">LOCKED</text>
  </g>
  <text x="450" y="252" font-size="12" fill="#C9D1D9" text-anchor="middle" letter-spacing="2">&#8220;ENTERING GAME DEVELOPMENT.&#8221;</text>
  <text x="450" y="276" font-size="10" fill="#31404F" text-anchor="middle" letter-spacing="2">FIRST BUILD IN PROGRESS &#183; STAGES UNLOCK WITH REAL WORK</text>
  <text x="40" y="312" font-size="9" fill="#31404F" letter-spacing="2">LEARNING MODULE &#183; NOT AN EXPERT CLAIM</text>
</svg>

